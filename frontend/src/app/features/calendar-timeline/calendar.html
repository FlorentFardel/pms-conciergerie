<app-ui-card>
  <div class="timeline-container">
    <!-- BARRE D'OUTILS -->
    <app-calendar-toolbar
      [viewMode]="viewMode()"
      [currentRangeLabel]="currentRangeLabel()"
      (viewModeChange)="setViewMode($event)"
      (navigate)="navigateTime($event)"
      (today)="goToToday()"
    ></app-calendar-toolbar>

    <!-- GRILLE DE LA TIMELINE DECOUPEE -->
    <app-calendar-grid
      [groupedProperties]="groupedProperties()"
      [timeColumns]="timeColumns()"
      [viewMode]="viewMode()"
      [getUnitBookingsFn]="getUnitBookingsBound"
      (slotClick)="openCreateModal($event.unitId, $event.dateStr)"
      (bookingClick)="openBookingDetails($event)"
    ></app-calendar-grid>
  </div>
</app-ui-card>

<!-- MODALE DE GESTION DES RÉSERVATIONS -->
@if (selectedBooking() || newBookingSelection()) {
  <app-booking-modal
    [booking]="selectedBooking()"
    [initialData]="newBookingSelection()"
    (close)="closeModals()"
    (save)="handleSaveBooking($event)"
    (delete)="handleDeleteBooking($event)"
  ></app-booking-modal>
}
