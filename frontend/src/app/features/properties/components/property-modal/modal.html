<app-ui-modal 
  [title]="propertyToEdit ? 'Modifier la Propriété' : 'Nouvelle Propriété'"
  [subtitle]="propertyToEdit ? 'Ajustez les informations du bâtiment.' : 'Renseignez les coordonnées du bâtiment.'"
  (close)="onClose()"
>
  <!-- FORMULAIRE (Injecté dans modal-body) -->
  <form modal-body id="propertyForm" (ngSubmit)="onSubmit()">
    @if (errorMessage) {
      <div class="modal-alert">
        <svg class="icon icon-alert" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <div class="form-field">
      <label for="name">Nom du bâtiment *</label>
      <input 
        id="name"
        type="text" 
        [(ngModel)]="formData.name" 
        name="name" 
        [class.has-error]="errorMessage" 
        placeholder="Ex: Résidence Les Jardins" 
        required 
      />
    </div>

    <div class="form-field">
      <label for="address">Adresse postale *</label>
      <input 
        id="address"
        type="text" 
        [(ngModel)]="formData.address" 
        name="address" 
        placeholder="Ex: 142 Boulevard Haussmann" 
        required 
      />
    </div>

    <div class="form-grid">
      <div class="form-field">
        <label for="postal_code">Code Postal *</label>
        <input 
          id="postal_code"
          type="text" 
          [(ngModel)]="formData.postal_code" 
          name="postal_code" 
          placeholder="75008" 
          required 
        />
      </div>
      <div class="form-field">
        <label for="city">Ville *</label>
        <input 
          id="city"
          type="text" 
          [(ngModel)]="formData.city" 
          name="city" 
          placeholder="Paris" 
          required 
        />
      </div>
    </div>
  </form>

  <!-- BOUTONS D'ACTION (Injectés dans modal-footer) -->
  <ng-container modal-footer>
    <button type="button" class="btn btn-secondary" (click)="onClose()">Annuler</button>
    <button type="submit" form="propertyForm" class="btn btn-primary">
      {{ propertyToEdit ? 'Mettre à jour' : 'Enregistrer la propriété' }}
    </button>
  </ng-container>
</app-ui-modal>
