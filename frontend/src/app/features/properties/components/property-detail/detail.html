<!-- ========================================================================= -->
<!-- VUE DÉTAILLÉE D'UNE PROPRIÉTÉ (BÂTIMENT)                                 -->
<!-- ========================================================================= -->
<div class="property-detail-container">

  @if (loading()) {
    <div class="loading-state">
      <p>Chargement de la propriété...</p>
    </div>
  } @else if (error()) {
    <div class="alert alert-danger" role="alert">
      {{ error() }}
    </div>
  } @else if (property()) {
    @let prop = property()!;
    
    <!-- En-tête avec composant UI Button unifié -->
    <header class="detail-header">
      <div class="header-actions">
        <app-ui-button 
          variant="primary" 
          (clicked)="goBack()"
          aria-label="Retourner à la liste des propriétés"
        >
          ← Retour aux propriétés
        </app-ui-button>
      </div>

      <div class="header-titles">
        <h2>{{ prop.name }}</h2>
        <p class="subtitle">{{ prop.address }}, {{ prop.postal_code }} {{ prop.city }}</p>
      </div>
    </header>

    <!-- Inclusion autonome du composant de gestion des logements -->
    <main class="units-section">
      <app-units-list [propertyId]="prop.id"></app-units-list>
    </main>
  }

</div>
