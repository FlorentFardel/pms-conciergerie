<!-- ========================================================================= -->
<!-- CARTE PROPRIÉTÉ COMPACTE & ALIGNÉE                                        -->
<!-- ========================================================================= -->
<article class="property-card" (click)="onCardClick()">
  
  <header class="card-header">
    <div class="title-group">
      <div class="building-badge" aria-hidden="true">
        <svg class="icon icon-building" viewBox="0 0 24 24">
          <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>
          <path d="M6 12H4a2 2 0 0 0-2 2v8h20v-8a2 2 0 0 0-2-2h-2"/>
          <path d="M10 6h4M10 10h4M10 14h4M10 18h4"/>
        </svg>
      </div>
      
      <div class="title-content">
        <h3>{{ property.name }}</h3>
        <!-- Badge du nombre de logements actifs -->
        <span 
          class="active-units-badge" 
          [class.has-warning]="hasInactiveUnits"
          title="Logements actifs sur le total de cette propriété"
        >
          {{ activeUnitsRatio }}
        </span>
      </div>
    </div>

    <div class="card-actions">
      <button 
        type="button" 
        class="btn icon-btn edit-btn" 
        title="Éditer la propriété" 
        (click)="onEdit($event)"
      >
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 2 2h14a2 2 0 0 2 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>

      <button 
        type="button" 
        class="btn icon-btn delete-btn" 
        title="Supprimer la propriété" 
        (click)="onDelete($event)"
      >
        <svg class="icon" viewBox="0 0 24 24">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="card-body">
    <div class="meta-row">
      <svg class="icon icon-pin" viewBox="0 0 24 24">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span class="address">{{ property.address }}, {{ property.postal_code }} {{ property.city }}</span>
    </div>
  </div>

  <footer class="card-footer">
    <button type="button" class="btn btn-secondary" (click)="onAddSingleUnit($event)">
      + Logement
    </button>
    <button type="button" class="btn btn-outline" (click)="onBulkCreateUnits($event)">
      + Générer lot
    </button>
  </footer>

</article>
