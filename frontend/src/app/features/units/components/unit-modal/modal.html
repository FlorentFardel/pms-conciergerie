<app-ui-modal 
  [title]="unitToEdit() ? 'Modifier le logement' : 'Nouveau logement'"
  [subtitle]="unitToEdit() ? 'Ajustez les caractéristiques du lot.' : 'Renseignez les détails du nouveau lot.'"
  (close)="onClose()"
>
  <!-- FORMULAIRE (Injecté dans modal-body) -->
  <form modal-body id="unitForm" (ngSubmit)="onSubmit()" class="unit-form">
    
    @if (errorMessage) {
      <div class="modal-alert">
        <span>{{ errorMessage }}</span>
      </div>
    }

    <div class="form-grid-2">
      <app-ui-form-field label="Numéro / Réf." [required]="true">
        <input 
          type="text" 
          [(ngModel)]="formData.unit_number" 
          name="unit_number" 
          placeholder="Ex: Apt 102" 
          required 
        />
      </app-ui-form-field>

      <app-ui-form-field label="Nom personnalisé">
        <input 
          type="text" 
          [(ngModel)]="formData.name" 
          name="name" 
          placeholder="Ex: Studio Vue Parc" 
        />
      </app-ui-form-field>
    </div>

    <div class="form-grid-3">
      <app-ui-form-field label="Type de bien" [required]="true">
        <select [(ngModel)]="formData.type" name="type">
          <option value="Studio">Studio</option>
          <option value="T1">T1</option>
          <option value="T2">T2</option>
          <option value="T3">T3</option>
          <option value="T4">T4</option>
          <option value="Maison">Maison</option>
        </select>
      </app-ui-form-field>

      <app-ui-form-field label="Capacité (pers.)" [required]="true">
        <input 
          type="number" 
          [(ngModel)]="formData.capacity" 
          name="capacity" 
          min="1" 
        />
      </app-ui-form-field>

      <app-ui-form-field label="Étage">
        <input 
          type="number" 
          [(ngModel)]="formData.floor" 
          name="floor" 
          placeholder="0" 
        />
      </app-ui-form-field>
    </div>

    <div class="form-grid-3">
      <app-ui-form-field label="Superficie (m²)">
        <input 
          type="number" 
          step="0.01" 
          [(ngModel)]="formData.surface" 
          name="surface" 
          placeholder="25.50" 
        />
      </app-ui-form-field>

      <app-ui-form-field label="Loyer HC (€)">
        <input 
          type="number" 
          step="0.01" 
          [(ngModel)]="formData.rent_amount" 
          name="rent_amount" 
          placeholder="550.00" 
        />
      </app-ui-form-field>

      <app-ui-form-field label="Charges (€)">
        <input 
          type="number" 
          step="0.01" 
          [(ngModel)]="formData.charges_amount" 
          name="charges_amount" 
          placeholder="50.00" 
        />
      </app-ui-form-field>
    </div>

  </form>

  <!-- BOUTONS D'ACTION (Injectés dans modal-footer) -->
  <ng-container modal-footer>
    <app-ui-button variant="secondary" (clicked)="onClose()">
      Annuler
    </app-ui-button>
    <app-ui-button 
      type="submit" 
      form="unitForm" 
      variant="primary"
      [loading]="isSubmitting"
    >
      {{ unitToEdit() ? 'Mettre à jour' : 'Enregistrer le logement' }}
    </app-ui-button>
  </ng-container>
</app-ui-modal>
