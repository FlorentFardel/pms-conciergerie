<div class="ui-card">
  @if (title) {
    <div class="card-header">
      <h3 class="card-title">{{ title }}</h3>
      <div class="card-header-actions">
        <ng-content select="[card-actions]"></ng-content>
      </div>
    </div>
  }
  <div class="card-body">
    <ng-content></ng-content>
  </div>
</div>
