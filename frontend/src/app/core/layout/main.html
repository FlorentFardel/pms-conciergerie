<!-- ========================================================================= -->
<!-- VUE PRINCIPALE : SQUELETTE GLOBAL DU LAYOUT                               -->
<!-- ========================================================================= -->

<!-- Bouton hamburger (visible uniquement sur mobile <1024px) -->
<button 
  class="mobile-hamburger-btn" 
  (click)="toggleSidebar()" 
  aria-label="Basculer le menu"
>
  <span>☰</span>
</button>

<!-- Fond sombre (Backdrop Mobile) : détruit du DOM quand isSidebarOpen est false -->
@if (isSidebarOpen()) {
  <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
}

<div class="app-layout">
  <!-- Composant Navigation Sidebar -->
  <app-ui-sidebar 
    [class.is-open]="isSidebarOpen()" 
    (linkClicked)="closeSidebar()"
  ></app-ui-sidebar>

  <!-- Zone de contenu applicatif (Routage dynamique) -->
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
